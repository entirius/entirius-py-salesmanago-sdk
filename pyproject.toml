[project]
name = "entirius-py-salesmanago-sdk"
version = "2.1.0rc1"
description = "SALESmanago marketing automation SDK for Python, part of Entirius, the open-source modular ecommerce platform"
keywords = ["salesmanago", "marketing-automation", "crm", "sdk", "django", "ecommerce", "entirius"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "requests>=2.28.1",
    "django>=4.2",
    "marshmallow>=3.19",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "faker"]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://docs.entirius.com/"
Repository = "https://github.com/entirius/entirius-py-salesmanago-sdk"
Changelog = "https://github.com/entirius/entirius-py-salesmanago-sdk/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-py-salesmanago-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salesmanago_sdk"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Legacy SDK migrated 1:1 — deferred cleanup:
"src/salesmanago_sdk/services/request.py" = ["S113", "E721"]  # requests without timeout; type == comparison
"tests/**" = ["S101", "S311", "F841"]                   # asserts; non-crypto random; unused response in smoke tests

[tool.ruff.lint.isort]
known-first-party = ["salesmanago_sdk"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
